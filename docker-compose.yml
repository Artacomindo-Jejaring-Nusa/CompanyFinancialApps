version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fspms_postgres
    restart: always
    environment:
      POSTGRES_DB: fspms_db
      POSTGRES_USER: fspms_user
      POSTGRES_PASSWORD: fspms_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fspms_user -d fspms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fspms_redis
    restart: always
    command: redis-server --requirepass fspms_redis_secret_pass_2026 --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "fspms_redis_secret_pass_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fspms_backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: fspms_user
      DB_PASSWORD: fspms_password
      DB_NAME: fspms_db
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: fspms_redis_secret_pass_2026
      JWT_SECRET: super_secret_jwt_key_fspms_2026
      JWT_EXPIRATION_HOURS: 24
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://localhost:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fspms_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
